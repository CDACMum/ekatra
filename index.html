 if(key==='tip'){const el=hv.cur;return el?`<div class="hv-d" style="margin:0">${esc(el.dataset.tip||'')}</div>`:''}
 if(key&&key.startsWith('prog:')){const[,k,mine]=key.split(':');const its=S.inits.filter(i=>progKeyOf(i)===k&&(!mine||i.ownerId===myId()||coOwns(i)));if(!its.length)return '';const s=progStats(its);
  return `<div class="hv-k">Programme${mine?' · yours':''}</div><div class="hv-t">${esc(progName(k))}</div>${statusStrip(s.status,6)}<div class="hv-list">${its.slice(0,8).map(i=>`<div><span class="dot" style="background:${INIT_STATUS_COL[i.status]||'#64748b'}"></span>${esc(shortInitName(i))}<em>${initProg(i)!=null?initProg(i)+'%':esc(i.status)}</em></div>`).join('')}${its.length>8?`<div class="muted">+${its.length-8} more</div>`:''}</div>${hvBar(s.avg,'var(--p)')}`}
 if(act==='openInit'){const i=S.inits.find(x=>x.id===id);if(!i)return '';const c=KIND_COL(i.kind);const nx=(i.milestones||[]).filter(m=>!m.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'))[0];
  return `<div class="hv-k" style="color:${c}">${esc(i.kind)}${progKeyOf(i)?' · '+esc(progName(progKeyOf(i))):''}</div><div class="hv-t">${esc(shortInitName(i))}</div>${hvDesc(i.description)}
  ${hvRow('Status',`<span style="color:${INIT_STATUS_COL[i.status]}">${esc(i.status)}</span>`)}${hvRow('Stage',esc(i.stage||''))}${hvRow('Owner',hvName(i.ownerId)||'<span class="od">Not set</span>')}${hvRow('Team',esc(teamOf(i.teamId)?.name||''))}${hvRow('Target',okDate(i.targetDate)?fmtDate(i.targetDate):'')}${hvRow('Next milestone',nx?esc(nx.title)+(okDate(nx.due)?' · '+fmtDay(nx.due):''):'')}${hvBar(initProg(i),c)}`}
 if(act==='openTask'){const x=S.tasks.find(y=>y.id===id);if(!x)return '';const od=isOverdue(x);
  return `<div class="hv-k" style="color:${STATUS_COL[stKey(x.status)]}">Task · ${esc((STATUSES.find(s=>s[0]===stKey(x.status))||[])[1]||x.status)}</div><div class="hv-t">${esc(x.title)}</div>${hvDesc(x.description)}
  ${hvRow('Doing it',hvNames(x.assigneeIds))}${hvRow('Owner',hvName(x.ownerId))}${hvRow('Due',okDate(x.due)?`<span class="${od?'od':''}">${fmtDay(x.due)}${od?' · overdue':''}</span>`:'')}${hvRow('Priority',esc(x.priority||''))}${hvRow('Next step',esc(x.nextStep||''))}${x.blocked?hvRow('Blocked',`<span class="od">${esc(x.blocked)}</span>`):''}${hvBar(progOf(x),STATUS_COL[stKey(x.status)])}`}
 if(act==='openChk'){const c=(S.checks||[]).find(y=>y.id===id);if(!c)return '';const b=S.batches.find(y=>y.id===c.batchId);const tr=chkTrack(c.track);const st=CHK_ST.find(s=>s[0]===c.status)||CHK_ST[0];const late=chkLate(c);
  return `<div class="hv-k" style="color:${tr.c}">${tr.icon} ${esc(tr.name)} checklist</div><div class="hv-t">${esc(c.title)}</div>${hvDesc(c.description)}
  ${hvRow('Batch',esc(b?.name||''))}${hvRow('Phase',esc(c.phase||''))}${hvRow('Owner',hvName(c.ownerId)||'<span class="od">Not set</span>')}${hvRow('Due',okDate(c.due)?`<span class="${late?'od':''}">${fmtDay(c.due)}${late?' · late':''}</span>`:'')}${hvRow('Status',`<span style="color:${st[2]}">${st[1]}</span>`)}${hvRow('Next step',esc(c.nextStep||''))}`}
 if(act==='openBatch'){const b=S.batches.find(y=>y.id===id);if(!b)return '';const ck=(S.checks||[]).filter(i=>i.batchId===b.id);const p=ck.length?chkPct(ck):null;const late=ck.filter(chkLate).length;
  return `<div class="hv-k">Batch · ${esc(batchStatus(b))}</div><div class="hv-t">${esc(b.name)}</div>${hvRow('Course',esc(b.course||''))}${hvRow('Dates',okDate(b.start)?fmtDate(b.start)+' – '+fmtDate(b.end):'')}${hvRow('Students',b.students?esc(b.students):'')}${hvRow('Coordinator',hvName(b.coordinatorId))}${ck.length?hvRow('Checklist',`${ck.filter(i=>i.status==='done').length}/${ck.length} done${late?` · <span class="od">${late} late</span>`:''}`):''}${hvBar(p,'#16a34a')}`}
 if(act==='openEvent'){const e=S.events.find(y=>y.id===id);if(!e)return '';
  return `<div class="hv-k" style="color:${evColor(e)}">${esc(e.type||'Event')}</div><div class="hv-t">${esc(e.title)}</div>${hvDesc(e.description)}${hvRow('When',(okDate(e.date)?fmtDay(e.date):'')+(okDate(e.endDate)&&e.endDate!==e.date?' – '+fmtDay(e.endDate):'')+' · '+evTime(e))}${hvRow('Where',esc(e.location||''))}${hvRow('Teams',(e.teamIds||[]).includes('all')?'All teams':esc((e.teamIds||[]).map(x=>teamOf(x)?.name).filter(Boolean).join(', ')))}${hvRow('Coordinator',hvName(e.coordinatorId)||esc(e.coordinator||''))}${hvRow('People',hvNames(e.attendeeIds))}`}
 if(act==='openPerson'){const m=memberOf(id);if(!m)return '';const st=memberStats(m.id);const ck=(S.checks||[]).filter(i=>i.ownerId===m.id&&chkOpen(i));const own=S.inits.filter(i=>i.ownerId===m.id&&!['Completed'].includes(i.status));const away=S.leaves.find(l=>okDate(l.from)&&l.from<=t&&l.to>=t&&l.memberId===m.id);
  return `<div class="hv-p">${avatar(m,'lg')}<div><div class="hv-t" style="margin:0">${esc(m.name)}</div><div class="xs muted">${esc(m.designation||ROLES[m.role]||'')}</div></div></div>${m.statusText||m.statusEmoji?`<div class="hv-d">${esc(m.statusEmoji||'')} ${esc(m.statusText||'')}</div>`:''}${away?`<div class="hv-d od">On ${esc(away.type)} today</div>`:''}
  ${hvRow('Teams',esc((m.teamIds||[]).map(x=>teamOf(x)?.name).filter(Boolean).join(', ')))}${hvRow('Open tasks',String(st.open.length)+(st.overdue.length?` · <span class="od">${st.overdue.length} overdue</span>`:''))}${ck.length?hvRow('Checklist items',`${ck.length} open${ck.filter(chkLate).length?` · <span class="od">${ck.filter(chkLate).length} late</span>`:''}`):''}${own.length?hvRow('Owns',esc(joinNames(own.map(shortInitName)))):''}`}
 return ''}
function joinNames(a){return a.length>3?a.slice(0,3).join(', ')+` +${a.length-3}`:a.join(', ')}
function hvHide(){clearTimeout(hv.t);hv.cur=null;if(hv.el)hv.el.hidden=true}
function hvShow(target){const key=target.dataset.hover||'';const html=hvContent(target.dataset.act,target.dataset.id,key);if(!html)return;const box=hvBox();box.innerHTML=html;box.hidden=false;
 const r=target.getBoundingClientRect();const bw=box.offsetWidth,bh=box.offsetHeight;const vw=innerWidth,vh=innerHeight;
 let x=r.left+Math.min(24,r.width/2);if(x+bw>vw-10)x=Math.max(10,r.right-bw);let y=r.bottom+8;if(y+bh>vh-10)y=Math.max(10,r.top-bh-8);
 box.style.left=x+'px';box.style.top=y+'px'}
const HV_SEL='[data-hover],[data-act="openInit"][data-id],[data-act="openTask"][data-id],[data-act="openChk"][data-id],[data-act="openBatch"][data-id],[data-act="openEvent"][data-id],[data-act="openPerson"][data-id]';
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
 document.addEventListener('mouseover',e=>{if(e.target.closest('.hovcard,.overlay,.menu'))return;const t=e.target.closest(HV_SEL);if(!t){if(hv.cur)hvHide();return}if(t===hv.cur)return;
  hvHide();if(pref('hover',true)===false)return;hv.cur=t;hv.t=setTimeout(()=>{if(hv.cur===t&&document.contains(t))hvShow(t)},420)});
 document.addEventListener('mousedown',hvHide,true);addEventListener('scroll',hvHide,true);addEventListener('keydown',hvHide,true);addEventListener('blur',hvHide);
}

/* Initiatives page: Mission 2030 (and any other programme) on its own tab, separate from the other initiatives */
function initTabs(pm,tab){if(!pm.size)return '';const others=S.inits.filter(i=>!pm.has(progKeyOf(i))).length;
 return `<div class="toggle itabs" style="margin-bottom:14px"><button class="${!tab?'on':''}" data-act="itab" data-v="">Initiatives <span class="c">${others}</span></button>${[...pm.entries()].map(([k,v])=>`<button class="${tab===k?'on':''}" data-act="itab" data-v="${esc(k)}" data-hover="prog:${esc(k)}">${esc(progName(k))} <span class="c">${v.length}</span></button>`).join('')}</div>`}
ACT.itab=el=>{S.ui.itab=el.dataset.v;render()};

/* ---------------- lighter text ----------------
   Long page explanations shrink to one line with an ⓘ; the full text shows on hover. */
function lighten(root){root.querySelectorAll('.small.muted[style*="margin:-"]').forEach(el=>{if(el.dataset.lt)return;const t=el.textContent.trim();if(t.length<90||el.querySelector('button,select,input'))return;
 el.dataset.lt=1;el.classList.add('intro-tip');el.dataset.hover='tip';el.dataset.tip=t;el.setAttribute('title','')})}

/* ---------------- guided tour ---------------- */
const TOUR=[
 {t:'Welcome to Ekatra 👋',d:'A quick look around. It takes about a minute. Skip any time and replay it from the ? button.'},
 {sel:'#nav [data-route="home"]',route:'home',t:'Home',d:'Your day at a glance: what is due, what needs you and what is coming up this week.'},
 {sel:'#createBtn',t:'Create',d:'Add a task, event, reminder, participation or initiative from here.'},
 {sel:'.gs',t:'Search & quick actions',d:'Press Ctrl K to jump anywhere. You can also type “assign Sahil viva questions friday”.'},
 {sel:'#nav [data-route="tasks"]',route:'tasks',t:'My work',d:'Today, tomorrow, the rest of the week and Ekatra’s suggestions for what to do next.'},
 {sel:'#nav [data-route="calendar"]',t:'Calendar',d:'Sessions, events, exams and reminders for every team in one calendar.'},
 {sel:'#nav [data-route="readiness"]',t:'Batch readiness',d:'Each team’s checklist for every batch. Tick items as they are done.'},
 {sel:'.itabs',route:'initiatives',t:'Initiatives & Mission 2030',d:'Products and projects under Initiatives; all Mission 2030 work on its own tab.'},
 {sel:'.tcardx',route:'initiatives',t:'Hover to preview',d:'Rest the mouse on any card, task or person to see its details without opening it.'},
 {sel:'#bellBtn',t:'Next 24 hours',d:'Meetings and reminders coming up soon. Ekatra also pops them up on time.'},
 {sel:'#meBox',t:'You',d:'Your profile, status, colours and password. “Take the tour” is here too.'},
 {t:'You’re all set ✨',d:'Replay this tour any time from the ? button at the top.',end:true}];
const tour={i:0,on:false,el:null};
const tourKey=()=>'tourDone:'+(myId()||'x');
function maybeTour(){if(store.get(tourKey(),false))return false;startTour(false);return true}
function startTour(){hvHide();if(openMenu)closeMenu();tour.i=0;tour.on=true;if(!tour.el){tour.el=document.createElement('div');tour.el.className='tour';document.body.appendChild(tour.el);
  tour.el.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const a=b.dataset.t;if(a==='next')tourGo(tour.i+1);else if(a==='back')tourGo(tour.i-1);else endTour()})}
 tour.el.hidden=false;tourGo(0)}
function endTour(){tour.on=false;store.set(tourKey(),true);if(tour.el)tour.el.hidden=true;if(S.route!=='home')go('home')}
function tourStepOk(s){if(!s.sel)return true;const el=document.querySelector(s.sel);return el&&el.offsetParent!==null}
function tourGo(i){const dir=i<tour.i?-1:1;if(i<0)i=0;if(i>=TOUR.length){endTour();return}const s=TOUR[i];tour.i=i;
 if(s.route&&S.route!==s.route){S.ui.initOpen=null;go(s.route)}
 setTimeout(()=>{if(!tour.on)return;if(!tourStepOk(s)&&!s.end&&s.sel){tour.i=i;if(dir<0&&i>0){tour.i=i+1;tourGo(i-1)}else{tour.i=i-1;tourGo(i+1)}return}tourDraw(s);setTimeout(()=>{if(tour.on&&tour.i===i)tourDraw(s,true)},550)},s.route?380:30)}
function tourDraw(s,still){const el=s.sel?document.querySelector(s.sel):null;let r=el?el.getBoundingClientRect():null;if(el)el.scrollIntoView({block:'nearest'});if(el)r=el.getBoundingClientRect();
 const n=TOUR.length;const pad=6;
 const hole=r?`<div class="tour-hole" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>`:'<div class="tour-dim"></div>';
 const dots=TOUR.map((_,k)=>`<i class="${k===tour.i?'on':''}"></i>`).join('');
 tour.el.innerHTML=`${hole}<div class="tour-pop ${r?'':'center'} ${still?'still':''}" role="dialog" aria-label="${esc(s.t)}"><div class="tour-step">${tour.i+1} of ${n}</div><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p>
 <div class="tour-f"><div class="tour-dots">${dots}</div><span style="flex:1"></span>${s.end?'':'<button class="btn sm ghost" data-t="skip">Skip tour</button>'}${tour.i>0?'<button class="btn sm" data-t="back">Back</button>':''}<button class="btn sm pri" data-t="next">${s.end?'Done':tour.i===0?'Start':'Next'}</button></div></div>`;
 const pop=tour.el.querySelector('.tour-pop');if(r){const pw=pop.offsetWidth,ph=pop.offsetHeight;let x=r.right+16,y=r.top;
  if(x+pw>innerWidth-12){x=Math.max(12,Math.min(r.left,innerWidth-pw-12));y=r.bottom+14;if(y+ph>innerHeight-12)y=Math.max(12,r.top-ph-14)}
  if(y+ph>innerHeight-12)y=innerHeight-ph-12;pop.style.left=x+'px';pop.style.top=Math.max(12,y)+'px'}
 pop.querySelector('[data-t="next"]').focus()}
document.addEventListener('keydown',e=>{if(!tour.on)return;if(e.key==='Escape'){e.stopImmediatePropagation();endTour()}else if(e.key==='ArrowRight')tourGo(tour.i+1);else if(e.key==='ArrowLeft')tourGo(tour.i-1)},true);
addEventListener('resize',()=>{if(tour.on)tourDraw(TOUR[tour.i],true)});
ACT.tour=()=>startTour(true);
</script>
