 const m=openModal({title:b?'Edit batch':'New batch',wide:true,body:`<div class="row2"><div class="fld"><label for="b_name">Batch name</label><input class="inp" id="b_name" maxlength="100" value="${esc(cur.name||'')}" placeholder="e.g. PG-DBDA August 2026"></div>
 <div class="fld"><label for="b_course">Course</label><input class="inp" id="b_course" list="b_courses" maxlength="80" value="${esc(cur.course||'')}"><datalist id="b_courses">${COURSES.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div></div>
 <div class="row3"><div class="fld"><label for="b_team">Team</label><select class="inp" id="b_team">${(b?S.teams:lead).map(t=>`<option value="${esc(t.id)}" ${cur.teamId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
 <div class="fld"><label for="b_start">Start date</label><input class="inp" type="date" id="b_start" value="${esc(cur.start||'')}"></div><div class="fld"><label for="b_end">End date</label><input class="inp" type="date" id="b_end" value="${esc(cur.end||'')}"></div></div>
 <div class="row3"><div class="fld"><label for="b_stu">Students</label><input class="inp" type="number" min="0" max="2000" id="b_stu" value="${+cur.students||''}"></div>
 <div class="fld"><label for="b_coord">Coordinator</label><select class="inp" id="b_coord">${memberOpts(cur.coordinatorId||'')}</select></div>
 <div class="fld"><label for="b_stat">Status</label><select class="inp" id="b_stat"><option value="Auto" ${cur.status!=='Cancelled'?'selected':''}>Automatic (from dates)</option><option ${cur.status==='Cancelled'?'selected':''}>Cancelled</option></select></div></div>
 <div class="fld"><label for="b_notes">Notes</label><textarea class="inp" id="b_notes" rows="2" maxlength="2000">${esc(cur.notes||'')}</textarea></div>
 ${!b||!(b.playbook||[]).length?`<div class="card pad" style="box-shadow:none;background:var(--surface2)"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="b_pb" checked> Add the standard batch playbook</label><div class="small muted" style="margin:6px 0 8px">Due dates are set from the start and end dates. Untick anything this batch won't have.</div><div class="checks" style="max-height:200px">${PLAYBOOK_TEMPLATE.map((t,i)=>`<label><input type="checkbox" name="pbt" value="${i}" checked>${esc(t[1])}</label>`).join('')}</div></div>`:''}
 ${visField(cur.visibility||'all','b_vis')}<div class="err" id="b_err"></div>`,foot:`${b&&(headsTeam(b.teamId)||b.coordinatorId===myId())?'<button class="btn dan" data-del>Delete batch</button>':''}<span class="sp"></span><button class="btn" data-c>Cancel</button><button class="btn pri" data-s>${b?'Save':'Create batch'}</button>`});
 const r=m.el;V(r,'[data-c]').onclick=m.close;
 const del=V(r,'[data-del]');if(del)del.onclick=async()=>{if(await confirmBox('Delete batch?',`"<b>${esc(b.name)}</b>" and its playbook will be deleted. Its events, sessions, tasks and participation stay but lose the link. This can't be undone.`,'Delete batch')){if(await run(()=>BE.del('batches',b.id),'Batch deleted','batches')){log(`deleted batch ${b.name}`,'batch',b);S.ui.batchOpen=null;m.close();render()}}};
 V(r,'[data-s]').onclick=async()=>{const name=V(r,'#b_name').value.trim();const start=V(r,'#b_start').value,end=V(r,'#b_end').value;const err=s=>V(r,'#b_err').textContent=s;
  if(!name)return err('Enter a batch name.');if(end&&start&&end<start)return err('End date is before the start date.');
  const body={name,course:V(r,'#b_course').value.trim(),teamId:V(r,'#b_team').value,start,end,students:+V(r,'#b_stu').value||0,coordinatorId:V(r,'#b_coord').value,status:V(r,'#b_stat').value,notes:V(r,'#b_notes').value.trim(),visibility:V(r,'#b_vis').value,updatedAt:Date.now()};
  const pbOn=V(r,'#b_pb')?.checked;let playbook=b?.playbook||[];
  if(pbOn){const pick=checked(r,'pbt').map(Number);playbook=pick.map(i=>{const t=PLAYBOOK_TEMPLATE[i];return{id:uid(),phase:t[0],title:t[1],due:pbDueDate(t[2],start,end),rel:t[2],type:t[3],category:t[4],allTeams:t[5],ownerId:body.coordinatorId||'',status:'todo',eventId:''}})}
  else if(b&&(b.start!==start||b.end!==end))playbook=playbook.map(p=>p.rel&&p.status==='todo'?{...p,due:pbDueDate(p.rel,start,end)}:p);
  body.playbook=playbook;V(r,'[data-s]').disabled=true;let ok;
  if(b)ok=await run(()=>BE.update('batches',b.id,body),'Batch saved','batches');else{body.id=uid();body.createdBy=myId();body.createdAt=Date.now();ok=await run(()=>BE.add('batches',body),'Batch created','batches');if(ok){S.ui.batchOpen=body.id}}
  if(ok){log(`${b?'updated':'created'} batch ${name}`,'batch',body);m.close();go('batches',true)}else V(r,'[data-s]').disabled=false};
}
async function savePlaybook(b,pb,msg){return run(()=>BE.update('batches',b.id,{playbook:pb,updatedAt:Date.now()}),msg,'batches')}
function pbItemForm(b,p){const cur=p||{phase:PHASES[1],status:'todo'};
 const m=openModal({title:p?'Edit playbook item':'Add playbook item',body:`<div class="fld"><label for="pi_t">What</label><input class="inp" id="pi_t" maxlength="120" value="${esc(cur.title||'')}" placeholder="e.g. Hackathon"></div>
 <div class="row2"><div class="fld"><label for="pi_ph">Phase</label><select class="inp" id="pi_ph">${PHASES.map(x=>`<option ${cur.phase===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fld"><label for="pi_d">Due date</label><input class="inp" type="date" id="pi_d" value="${esc(cur.due||'')}"></div></div>
 <div class="row2"><div class="fld"><label for="pi_o">Owner</label><select class="inp" id="pi_o">${memberOpts(cur.ownerId||'')}</select></div><div class="fld"><label for="pi_c">Counts as (participation)</label><select class="inp" id="pi_c">${CATS.map(c=>`<option ${cur.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="pi_all" ${cur.allTeams?'checked':''}> This involves all teams (e.g. convocation, picnic, expert talk)</label>`,foot:`${p?'<button class="btn dan" data-del>Remove</button>':''}<span class="sp"></span><button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`});
 const r=m.el;V(r,'[data-c]').onclick=m.close;
 const del=V(r,'[data-del]');if(del)del.onclick=async()=>{if(await savePlaybook(b,(b.playbook||[]).filter(x=>x.id!==p.id),'Item removed'))m.close()};
 V(r,'[data-s]').onclick=async()=>{const title=V(r,'#pi_t').value.trim();if(!title){toast('Enter what the item is.','error');return}
  const item={...cur,id:cur.id||uid(),title,phase:V(r,'#pi_ph').value,due:V(r,'#pi_d').value,ownerId:V(r,'#pi_o').value,category:V(r,'#pi_c').value,allTeams:V(r,'#pi_all').checked,rel:p&&p.due===V(r,'#pi_d').value?cur.rel:null,type:cur.type||'Event',status:cur.status||'todo',eventId:cur.eventId||''};
  const pb=p?(b.playbook||[]).map(x=>x.id===p.id?item:x):[...(b.playbook||[]),item];if(await savePlaybook(b,pb,'Playbook updated'))m.close()};
}
function pbMenu(el){const b=S.batches.find(x=>x.id===el.dataset.id);const p=(b?.playbook||[]).find(x=>x.id===el.dataset.p);if(!p)return;
 popMenu(el,`${p.status!=='done'&&!p.eventId?`<button data-m="sched">${ICON.calendar}<span><b>Schedule on calendar</b><small>Creates an event for ${esc(fmtDay(p.due)||'a date')}</small></span></button>`:''}${p.eventId?`<button data-m="ev">${ICON.calendar}<span><b>Open event</b></span></button>`:''}<button data-m="edit">${ICON.tasks}<span><b>Edit item</b><small>Title, date, owner</small></span></button><button data-m="task">${ICON.check}<span><b>Create a task for this</b></span></button>`,
 mm=>mm.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{closeMenu();const k=x.dataset.m;
  if(k==='sched')openEventForm(null,{title:`${p.title} — ${b.name}`,type:EV_TYPES.includes(p.type)?p.type:'Event',date:okDate(p.due)?p.due:today(),teamIds:p.allTeams?['all']:[b.teamId],batchId:b.id,playbookItemId:p.id,attendeeIds:p.ownerId?[p.ownerId]:[],visibility:b.visibility||'all'});
  if(k==='ev')openEvent(p.eventId);if(k==='edit')pbItemForm(b,p);
  if(k==='task')openTaskForm(null,{title:`${p.title} — ${b.name}`,teamId:b.teamId,batchId:b.id,due:p.due,assigneeIds:p.ownerId?[p.ownerId]:[],ownerId:p.ownerId})}))}
async function pbToggle(el){const b=S.batches.find(x=>x.id===el.dataset.id);const p=(b?.playbook||[]).find(x=>x.id===el.dataset.p);if(!p)return;
 if(p.status==='done'){const pb=b.playbook.map(x=>x.id===p.id?{...x,status:x.eventId?'scheduled':'todo',doneAt:null}:x);await savePlaybook(b,pb,'Marked not done');return}
 const ev=p.eventId?S.events.find(e=>e.id===p.eventId):null;if(ev&&ev.status!=='done'){markDone(ev);return}
 const m=openModal({title:`Done: ${p.title}`,body:`<div class="muted">${esc(b.name)}</div><div class="fld"><label for="pd_o">Outcome (optional)</label><textarea class="inp" id="pd_o" rows="3" maxlength="2000" placeholder="What happened, numbers, feedback…"></textarea></div>
 <div class="fld"><label for="pd_d">Done on</label><input class="inp" type="date" id="pd_d" value="${esc(p.due&&p.due<today()?p.due:today())}"></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="pd_p" ${p.category&&p.category!=='Other'?'checked':''}> Record participation for the people involved</label><div class="checks" id="pd_people">${[...S.members].sort(byName).map(mm=>`<label><input type="checkbox" name="pdp" value="${esc(mm.id)}" ${mm.id===p.ownerId?'checked':''}>${esc(mm.name)}</label>`).join('')}</div>`,foot:`<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Mark done</button>`});
 const r=m.el;V(r,'[data-c]').onclick=m.close;V(r,'#pd_p').onchange=e=>V(r,'#pd_people').style.display=e.target.checked?'':'none';if(!V(r,'#pd_p').checked)V(r,'#pd_people').style.display='none';
 V(r,'[data-s]').onclick=async()=>{const o=V(r,'#pd_o').value.trim(),d=V(r,'#pd_d').value||today();const pb=b.playbook.map(x=>x.id===p.id?{...x,status:'done',doneAt:Date.now(),outcome:o,doneOn:d}:x);
  if(!await savePlaybook(b,pb,'Ticked off'))return;log(`completed "${p.title}" for ${b.name}`,'batch',b);
  if(V(r,'#pd_p').checked){const ids=checked(r,'pdp');if(ids.length){const participants=ids.map(id=>({memberId:id,role:id===p.ownerId?'Coordinator':'Participant'}));
   await run(()=>BE.add('parts',{id:uid(),title:`${p.title} — ${b.name}`,category:p.category||'Other',scope:'Internal',date:d,endDate:'',teamIds:p.allTeams?S.teams.map(t=>t.id):[b.teamId],participants,memberIds:ids,hours:0,location:'',description:o,link:'',eventId:'',batchId:b.id,visibility:b.visibility||'all',createdBy:myId(),createdAt:Date.now()}),'Participation recorded','parts')}}
  m.close()};
}

/* =================== INITIATIVES =================== */
function filteredInits(){const f=S.ui.inf;const q=f.q.trim().toLowerCase();return S.inits.filter(i=>(!f.kind||i.kind===f.kind)&&(!f.status||i.status===f.status)&&(!f.team||i.teamId===f.team)&&(!q||(i.name||'').toLowerCase().includes(q)||(i.description||'').toLowerCase().includes(q)))}
function initProg(i){const sp=stageProg(i);if(sp!=null)return sp;const ms=i.milestones||[];if(!ms.length)return i.status==='Completed'||i.status==='Live'?100:null;return Math.round(ms.filter(x=>x.done).length/ms.length*100)}
function initLi(i){const p=initProg(i);const late=okDate(i.targetDate)&&i.targetDate<today()&&!['Completed','Live','On hold'].includes(i.status);
 return `<div class="li click" data-act="openInit" data-id="${esc(i.id)}"><span class="pill" style="background:color-mix(in srgb,${INIT_STATUS_COL[i.status]||'#64748b'} 12%,var(--mix));color:${INIT_STATUS_COL[i.status]||'#64748b'};min-width:78px;text-align:center">${esc(i.status)}</span><div class="grow"><div class="t">${esc(i.name)} ${visBadge(i.visibility)}</div><div class="small muted">${esc(i.kind)} · ${esc(teamOf(i.teamId)?.name||'')}${i.stage?' · '+esc(i.stage):''}${okDate(i.targetDate)?` · <span class="${late?'od':''}">target ${fmtDate(i.targetDate)}</span>`:''}</div></div>${memberOf(i.ownerId)?avatar(memberOf(i.ownerId),'sm'):''}${p!=null?`<span class="small muted" style="width:36px;text-align:right">${p}%</span>`:''}</div>`}
function initCard(i){const c=KIND_COL(i.kind);const p=initProg(i);const late=okDate(i.targetDate)&&i.targetDate<today()&&!['Completed','Live','On hold'].includes(i.status);const o=memberOf(i.ownerId);
 return `<div class="card tcardx" style="--c:${c}" data-act="openInit" data-id="${esc(i.id)}" role="button" tabindex="0"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="cat" style="--c:${c}">${esc(i.kind)}</span><span class="pill" style="background:color-mix(in srgb,${INIT_STATUS_COL[i.status]||'#64748b'} 12%,var(--mix));color:${INIT_STATUS_COL[i.status]||'#64748b'}">${esc(i.status)}</span>${visBadge(i.visibility)}</div>
 <div class="nm">${esc(i.name)}</div><div class="ds" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(i.description||'')}</div>
 ${p!=null?`<div class="bar" style="--c:${c}"><i style="width:${p}%"></i></div><div class="xs muted" style="margin-top:4px">${stageProg(i)!=null?`Stage ${stageIdx(i)+1}/${stagesOf(i).length}: <b style="color:${c}">${esc(i.stage)}</b>`:`${(i.milestones||[]).filter(x=>x.done).length}/${(i.milestones||[]).length} milestones`}</div>`:''}
 <div style="display:flex;align-items:center;gap:8px;margin-top:12px">${o?avatar(o,'sm')+`<span class="small">${esc(o.name)}</span>`:'<span class="small od">No owner</span>'}<span style="flex:1"></span>${teamTag(i.teamId)}</div>
 ${okDate(i.targetDate)?`<div class="xs ${late?'od':'muted'}" style="margin-top:8px">Target ${fmtDate(i.targetDate)}${late?' — overdue':''}</div>`:''}${i.users?`<div class="xs muted" style="margin-top:4px">Users / reach: ${esc(i.users)}</div>`:''}</div>`}
function viewInitiatives(){
 if(S.ui.initOpen){const i=S.inits.find(x=>x.id===S.ui.initOpen);if(i)return initDetail(i);S.ui.initOpen=null}
 const f=S.ui.inf;const pm=programmes(S.inits);const tab=pm.has(S.ui.itab)?S.ui.itab:'';const list=filteredInits().filter(i=>tab?progKeyOf(i)===tab:!pm.has(progKeyOf(i)));
 let h=initTabs(pm,tab)+`<div class="toolbar"><input class="inp" id="iq" placeholder="Search initiatives" value="${esc(f.q)}" data-input="iq" style="width:190px" aria-label="Search initiatives">
 <select class="inp" data-change="ikind" aria-label="Kind"><option value="">All kinds</option>${INIT_KINDS.map(k=>`<option ${f.kind===k?'selected':''}>${k}</option>`).join('')}</select>
 <select class="inp" data-change="istatus" aria-label="Status"><option value="">Any status</option>${INIT_STATUS.map(k=>`<option ${f.status===k?'selected':''}>${k}</option>`).join('')}</select>
 <select class="inp" data-change="iteam" aria-label="Team">${teamOpts(f.team,'All teams')}</select><span style="flex:1"></span>
 <div class="toggle"><button class="${S.ui.iview==='cards'?'on':''}" data-act="iview" data-v="cards">Cards</button><button class="${S.ui.iview==='board'?'on':''}" data-act="iview" data-v="board">Pipeline</button></div><button class="btn pri" data-act="newInit">+ New initiative</button></div>
 <div class="small muted" style="margin:-6px 0 14px">Products, course development, new course launches, corporate & staff training, campaigns and partnerships — each with an owner, who is responsible for what, and milestones.</div>`;
 if(!S.inits.length)return h+`<div class="card pad empty"><b>No initiatives yet</b>Add your products (Sarthi, Netra AI…), new course launches, corporate trainings and partnerships.</div>`;
 if(!list.length)return h+`<div class="card pad empty">Nothing matches these filters.</div>`;
 if(S.ui.iview==='board')return h+`<div class="board" style="grid-template-columns:repeat(${INIT_STATUS.length},minmax(230px,1fr))">${INIT_STATUS.map(s=>{const it=list.filter(i=>i.status===s);return `<div class="col"><h4><span><span style="color:${INIT_STATUS_COL[s]}">●</span> ${s}</span><span class="muted">${it.length}</span></h4>${it.map(i=>`<div class="tk" data-act="openInit" data-id="${esc(i.id)}" role="button" tabindex="0"><div class="row"><span class="cat" style="--c:${KIND_COL(i.kind)}">${esc(i.kind)}</span>${memberOf(i.ownerId)?avatar(memberOf(i.ownerId),'sm'):''}</div><div class="ttl">${esc(i.name)}</div>${initProg(i)!=null?`<div class="bar" style="--c:${KIND_COL(i.kind)}"><i style="width:${initProg(i)}%"></i></div>`:''}<div class="xs muted">${esc(teamOf(i.teamId)?.name||'')}${i.stage?' · '+esc(i.stage):''}${okDate(i.targetDate)?' · '+fmtDate(i.targetDate):''}</div></div>`).join('')||'<div class="small muted" style="padding:8px">—</div>'}</div>`}).join('')}</div>`;
 return h+(tab?progPanel(tab,list,true):`<div class="grid cards-grid">${list.map(initCard).join('')}</div>`);
}
function initDetail(i){
 const can=canEditInit(i);const c=KIND_COL(i.kind);const ms=i.milestones||[];const p=initProg(i);const tasks=S.tasks.filter(x=>x.initiativeId===i.id);const upd=[...(i.updates||[])].reverse();
 let h=`<button class="btn sm back" data-act="closeInit">← All initiatives</button>
 <div class="card tcardx" style="--c:${c};cursor:default;padding:22px;margin-bottom:16px"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${p!=null?ring(p,c):''}<div style="flex:1;min-width:220px"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><span class="cat" style="--c:${c}">${esc(i.kind)}</span><span class="pill" style="background:color-mix(in srgb,${INIT_STATUS_COL[i.status]} 12%,var(--mix));color:${INIT_STATUS_COL[i.status]}">${esc(i.status)}</span>${teamTag(i.teamId)}${visBadge(i.visibility)}</div><h2 style="margin:0;font-size:22px">${esc(i.name)}</h2>
 <div class="muted" style="margin-top:6px;white-space:pre-wrap">${esc(i.description||'')}</div></div><div style="display:flex;gap:8px" class="no-print">${can&&(i.ownerId===myId()||headsTeam(i.teamId)||!i.ownerId)?`<button class="btn sm" data-act="handoverInit" data-id="${esc(i.id)}">Hand over</button>`:''}${can?`<button class="btn sm" data-act="editInit" data-id="${esc(i.id)}">Edit</button>`:''}</div></div>
 ${can?'':`<div style="margin-top:14px">${viewOnly(i.ownerId)}</div>`}
 ${stagesOf(i).length?`<div style="margin-top:14px"><div class="xs muted" style="margin-bottom:6px">STAGE${can?' — click a stage to move':''}</div>${stageStepper(i,can)}</div>`:''}
 <dl class="kv" style="margin-top:14px"><dt>Owner</dt><dd>${memberOf(i.ownerId)?personLink(memberOf(i.ownerId)):'<span class="od">Not set</span>'}</dd>${(i.responsibilities||[]).some(r=>r.role==='Co-owner'&&memberOf(r.memberId))?`<dt>Co-owner</dt><dd>${(i.responsibilities||[]).filter(r=>r.role==='Co-owner'&&memberOf(r.memberId)).map(r=>personLink(memberOf(r.memberId))).join(', ')}</dd>`:''}${okDate(i.startDate)?`<dt>Started</dt><dd>${fmtDate(i.startDate)}</dd>`:''}${okDate(i.targetDate)?`<dt>Target</dt><dd>${fmtDate(i.targetDate)}</dd>`:''}${i.users?`<dt>Users / reach</dt><dd>${esc(i.users)}</dd>`:''}${i.link?`<dt>Link</dt><dd>${isUrl(i.link)?`<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.link)}</a>`:esc(i.link)}</dd>`:''}</dl></div>
 ${oppPanel(i)}<div class="grid two"><div style="display:flex;flex-direction:column;gap:16px"><div class="card pad"><h3>Milestones<span class="c">${ms.filter(x=>x.done).length}/${ms.length}</span><span class="sp"></span>${can?`<button class="btn sm" data-act="msAdd" data-id="${esc(i.id)}">+ Add</button>`:''}</h3>
 ${ms.length?ms.map(x=>`<div class="pb ${x.done?'done':''}"><button class="chk ${x.done?'on':''}" ${can?`data-act="msToggle" data-id="${esc(i.id)}" data-m="${esc(x.id)}"`:'disabled'} aria-label="${x.done?'Mark not done':'Mark done'}: ${esc(x.title)}">${x.done?'✓':''}</button><div class="pt">${esc(x.title)}</div>${memberOf(x.ownerId)?avatar(memberOf(x.ownerId),'sm'):''}<span class="meta ${!x.done&&okDate(x.due)&&x.due<today()?'od':''}">${okDate(x.due)?fmtDay(x.due):''}</span>${can?`<button class="btn sm ghost" data-act="msDel" data-id="${esc(i.id)}" data-m="${esc(x.id)}" aria-label="Remove ${esc(x.title)}">✕</button>`:''}</div>`).join(''):'<div class="empty small">No milestones yet. Break the initiative into a few checkpoints.</div>'}</div>

function repCsv(){const rp=S.ui.rep;const from=rp.month+'-01';const toD=new Date(+rp.month.slice(0,4),+rp.month.slice(5,7),0);const to=ymd(toD);const inM=d=>okDate(d)&&d>=from&&d<=to;
 const rows=[['Type','Date','Title','Team','People','Status / category','Notes']];
 for(const x of S.tasks)if(x.status==='done'&&x.doneAt&&inM(ymd(new Date(+x.doneAt))))rows.push(['Task completed',ymd(new Date(+x.doneAt)),x.title,teamOf(x.teamId)?.name||'',(x.assigneeIds||[]).map(i=>memberOf(i)?.name).join('; '),'Done','']);
 for(const e of S.events)if(inM(e.date)&&e.type!=='Session')rows.push(['Event',e.date,e.title,(e.teamIds||[]).map(i=>i==='all'?'All':teamOf(i)?.name).join('; '),(e.attendeeIds||[]).map(i=>memberOf(i)?.name).join('; '),e.status,e.outcome||'']);
 for(const p of S.parts)if(inM(p.date))rows.push(['Participation',p.date,p.title,(p.teamIds||[]).map(i=>teamOf(i)?.name).join('; '),(p.participants||[]).map(x=>`${memberOf(x.memberId)?.name} (${x.role})`).join('; '),p.category,p.description||'']);
 saveCsv(`ekatra-report-${rp.month}.csv`,rows)}

/* ---------- series helpers ---------- */
function weekBuckets(n){const ws=weekStart(today());return[...Array(n)].map((_,i)=>addDays(ws,-7*(n-1-i)))}
const wkLabel=d=>parseYmd(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function monthBuckets(n){const t=new Date();return[...Array(n)].map((_,i)=>{const d=new Date(t.getFullYear(),t.getMonth()-(n-1-i),1);return ymd(d).slice(0,7)})}
const moLabel=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString('en-IN',{month:'short',year:'2-digit'});
function bucketIdx(buckets,d,step){for(let i=buckets.length-1;i>=0;i--){if(d>=buckets[i])return d<addDays(buckets[i],step)?i:-1}return -1}
function activityDays(filterMember,teamF){const m=new Map();const add=d=>{if(okDate(d))m.set(d,(m.get(d)||0)+1)};
 for(const x of S.tasks){if(teamF&&x.teamId!==teamF)continue;for(const u of(x.updates||[]))if(!filterMember||u.by===filterMember)add(ymd(new Date(+u.at||0)))}
 for(const p of S.parts){if(teamF&&!(p.teamIds||[]).includes(teamF))continue;if(!filterMember||(p.memberIds||[]).includes(filterMember))add(p.date)}
 for(const e of S.events){if(e.status!=='done'||e.type==='Session')continue;if(teamF&&!(e.teamIds||[]).includes(teamF))continue;if(!filterMember||(e.attendeeIds||[]).includes(filterMember)||e.createdBy===filterMember)add(e.date)}return m}
function heatmap(map,weeks=26,title='Activity'){const end=weekStart(today());const start=addDays(end,-7*(weeks-1));const max=Math.max(1,...map.values());const shades=['var(--hover)','color-mix(in srgb,var(--p) 18%,var(--mix))','color-mix(in srgb,var(--p) 38%,var(--mix))','color-mix(in srgb,var(--p) 60%,var(--mix))','color-mix(in srgb,var(--p) 80%,var(--mix))','var(--p7)'];
 let cells='',months='';let lastM='';for(let w=0;w<weeks;w++){const ws=addDays(start,w*7);const mo=parseYmd(ws).toLocaleDateString('en-IN',{month:'short'});months+=`<span style="grid-column:${w+1}">${mo!==lastM?mo:''}</span>`;lastM=mo;
  for(let d=0;d<7;d++){const day=addDays(ws,d);const n=day>today()?-1:(map.get(day)||0);const lvl=n<=0?0:Math.min(5,Math.ceil(n/max*5));cells+=`<i style="grid-column:${w+1};grid-row:${d+1};background:${n<0?'transparent':shades[lvl]}" title="${esc(fmtDay(day))}: ${n<0?'—':n+' update'+(n===1?'':'s')}"></i>`}}
 const total=[...map.entries()].filter(([d])=>d>=start).reduce((s,[,n])=>s+n,0);
 return `<div class="heat-wrap"><div class="heat-months" style="grid-template-columns:repeat(${weeks},1fr)">${months}</div><div class="heat" style="grid-template-columns:repeat(${weeks},1fr)" role="img" aria-label="${esc(title)}: ${total} updates in ${weeks} weeks">${cells}</div>
 <div class="heat-leg"><span class="small muted">${total} updates · last ${weeks} weeks</span><span style="flex:1"></span><span class="xs muted">Less</span>${shades.map(c=>`<i style="background:${c}"></i>`).join('')}<span class="xs muted">More</span></div></div>`}

async function setStage(el){const i=S.inits.find(x=>x.id===el.dataset.id);if(!i||!canEditInit(i))return;const s=el.dataset.s;const from=i.stage||'—';

 if(await run(()=>BE.update('inits',i.id,{stage:s,updates:u,updatedAt:Date.now()}),null,'inits')){log(`moved ${i.name} to stage "${s}"`,'init',i);
  const st=stagesOf(i);if(st.indexOf(s)===st.length-1)celebrate(`${i.name} reached its final stage: ${s}`);else toast(`${i.name} → ${s}`)}}

function handoverInit(el){const i=S.inits.find(x=>x.id===el.dataset.id);if(!i)return;const from=memberOf(i.ownerId);
 const m=openModal({title:'Hand over initiative',body:`<div class="small muted">Pass <b>${esc(i.name)}</b> to someone else. The new person becomes the owner and the hand-over is kept in the history.</div>
 <dl class="kv"><dt>Current owner</dt><dd>${from?esc(from.name):'—'}</dd></dl>
 <div class="fld"><label for="ho_to">New owner</label><select class="inp" id="ho_to">${memberOpts('','— Choose a person —')}</select></div>
 <div class="fld"><label for="ho_keep">${from?esc(shortName(from.name)):'Previous owner'} stays on as</label><select class="inp" id="ho_keep"><option value="Co-owner">Co-owner</option><option value="Advisor">Advisor</option><option value="">Leaves this initiative</option></select></div>
 <div class="fld"><label for="ho_note">Hand-over note (what's done, what's pending)</label><textarea class="inp" id="ho_note" rows="3" maxlength="800" placeholder="e.g. Vendor finalised; MoU draft with legal; next review on 5 Dec"></textarea></div><div class="err" id="ho_err"></div>`,
 foot:`<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Hand over</button>`});
 const r=m.el;V(r,'[data-c]').onclick=m.close;
 V(r,'[data-s]').onclick=async()=>{const to=V(r,'#ho_to').value;if(!to)return V(r,'#ho_err').textContent='Choose the new owner.';if(to===i.ownerId)return V(r,'#ho_err').textContent='That person is already the owner.';
  const keep=V(r,'#ho_keep').value;const note=V(r,'#ho_note').value.trim();const nm=memberOf(to);
  let resp=(i.responsibilities||[]).filter(x=>x.memberId!==to&&x.memberId!==i.ownerId);
  resp.unshift({memberId:to,role:'Owner',note:''});if(i.ownerId&&keep)resp.push({memberId:i.ownerId,role:keep,note:'Previous owner'});
  const memberIds=[...new Set([to,...resp.map(x=>x.memberId)])];
  const text=`Handed over from ${from?.name||'—'} to ${nm.name}${note?' — '+note:''}`;
  const u=[...(i.updates||[]).slice(-59),{...actor(),at:Date.now(),text,handover:{from:i.ownerId||'',to}}];
  V(r,'[data-s]').disabled=true;
  if(await run(()=>BE.update('inits',i.id,{ownerId:to,responsibilities:resp,memberIds,updates:u,updatedAt:Date.now()}),`${i.name} is now with ${shortName(nm.name)}`,'inits')){log(`handed over ${i.name} to ${nm.name}`,'init',{...i,ownerId:to,memberIds});m.close()}else V(r,'[data-s]').disabled=false}}
const canHandoverTask=x=>!!me()&&x.status!=='done'&&(canManageTask(x)||x.ownerId===myId()||(x.assigneeIds||[]).includes(myId()));
function handoverTask(id,after){const x=S.tasks.find(t=>t.id===id);if(!x)return;const mid=myId();
 const fromId=(x.ownerId===mid||(x.assigneeIds||[]).includes(mid))?mid:(x.ownerId||(x.assigneeIds||[])[0]||'');const from=memberOf(fromId);
 const m=openModal({title:'Hand over task',body:`<div class="small muted">Pass <b>${esc(x.title)}</b> to someone else. They take over your part of the work; the hand-over is written in the work log.</div>
 <dl class="kv"><dt>From</dt><dd>${from?esc(from.name):'—'}</dd></dl>
 <div class="fld"><label for="ht_to">Hand over to</label><select class="inp" id="ht_to">${memberOpts('','— Choose a person —')}</select></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="ht_help" checked> ${fromId===mid?'I':esc(shortName(from?.name||''))} stay${fromId===mid?'':'s'} on as a helper</label>
 <div class="fld"><label for="ht_note">Hand-over note</label><textarea class="inp" id="ht_note" rows="3" maxlength="800" placeholder="What's done, what's pending, files and contacts"></textarea></div><div class="err" id="ht_err"></div>`,
 foot:`<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Hand over</button>`});
 const r=m.el;V(r,'[data-c]').onclick=m.close;
 V(r,'[data-s]').onclick=async()=>{const to=V(r,'#ht_to').value;if(!to)return V(r,'#ht_err').textContent='Choose a person.';if(to===fromId)return V(r,'#ht_err').textContent='Choose someone else.';
  const cur=S.tasks.find(t=>t.id===id)||x;const nm=memberOf(to);const note=V(r,'#ht_note').value.trim();
  let as=(cur.assigneeIds||[]).filter(a=>a!==fromId&&a!==to);as.unshift(to);
  const patch={assigneeIds:as,ownerId:(!cur.ownerId||cur.ownerId===fromId)?to:cur.ownerId,updatedAt:Date.now()};
  if(V(r,'#ht_help').checked&&fromId)patch.helperIds=[...new Set([...(cur.helperIds||[]).filter(h=>h!==to),fromId])];else patch.helperIds=(cur.helperIds||[]).filter(h=>h!==to);
  const u=(cur.updates||[]).slice(-59);u.push({...actor(),at:Date.now(),text:`Handed over from ${from?.name||'—'} to ${nm.name}${note?' — '+note:''}`,progress:progOf(cur),handover:{from:fromId,to}});patch.updates=u;
  V(r,'[data-s]').disabled=true;
  if(await run(()=>BE.update('tasks',id,patch),`Handed over to ${shortName(nm.name)}`,'tasks')){log(`handed over "${cur.title}" to ${nm.name}`,'task',{...cur,...patch});m.close();after&&after()}else V(r,'[data-s]').disabled=false}}

/* ---------------- congratulations & wins ---------------- */
function celebrate(msg,sub){const el=document.createElement('div');el.className='celebrate';el.setAttribute('role','status');
 const bits=reduceMotion()?'':Array.from({length:46},(_,k)=>`<i style="--x:${Math.random()*100}vw;--d:${(0.6+Math.random()*1.2).toFixed(2)}s;--r:${Math.round(Math.random()*720-360)}deg;--c:${PALETTE[k%PALETTE.length]};--w:${6+Math.round(Math.random()*6)}px"></i>`).join('');
 el.innerHTML=`<div class="confetti" aria-hidden="true">${bits}</div><div class="cbox"><div class="big">${ICON.check}</div><b>${esc(msg)}</b><div class="small muted">${esc(sub||'Great work — your team can see it on the Wins board.')}</div></div>`;
 document.body.append(el);const close=()=>el.remove();el.onclick=close;setTimeout(close,3800)}
function congratsFor(x){const who=(x.assigneeIds||[]).map(memberOf).filter(Boolean).map(m=>shortName(m.name));const mine=(x.assigneeIds||[]).includes(myId())||x.ownerId===myId();
 celebrateSmall(mine?`Nice work${me()?', '+callMe():''} — task done`:`Task completed${who.length?' by '+who.join(', '):''}`,x.title)}
function recentWins(days=14,scopeMine=false){const from=Date.now()-days*86400000;
 return S.tasks.filter(x=>x.status==='done'&&+x.doneAt>=from&&(!scopeMine||involvedIn(x)||(x.assigneeIds||[]).some(a=>myTeams().some(t=>(memberOf(a)?.teamIds||[]).includes(t))))).sort((a,b)=>+b.doneAt-+a.doneAt)}
function winLi(x){const k=x.kudos||[];const mine=k.includes(myId());const ppl=[...new Set([...(x.assigneeIds||[]),x.ownerId].filter(Boolean))];const self=ppl.includes(myId());
 return `<div class="li win"><span class="win-ic" aria-hidden="true">${ICON.check}</span><div class="grow click" data-act="openTask" data-id="${esc(x.id)}" role="button" tabindex="0"><div class="t">${esc(x.title)}</div><div class="small muted">${esc(ppl.map(memberOf).filter(Boolean).map(m=>shortName(m.name)).join(', ')||'—')} · ${ago(+x.doneAt)}${k.length?` · 👏 ${esc(k.map(memberOf).filter(Boolean).map(m=>shortName(m.name)).slice(0,4).join(', '))}${k.length>4?' +'+(k.length-4):''}`:''}</div></div>
 ${self?`<span class="pill" title="Claps from colleagues">👏 ${k.length}</span>`:`<button class="btn sm ${mine?'soft':''}" data-act="kudos" data-id="${esc(x.id)}" aria-pressed="${mine}" title="${mine?'Take back your clap':'Congratulate'}">👏 ${k.length||''}</button>`}</div>`}
async function kudos(el){const x=S.tasks.find(t=>t.id===el.dataset.id);if(!x)return;const mid=myId();const k=x.kudos||[];const on=!k.includes(mid);
 if(await run(()=>BE.update('tasks',x.id,{kudos:on?[...k,mid]:k.filter(i=>i!==mid)}),on?'👏 Congratulated!':null,'tasks')&&on){const who=(x.assigneeIds||[]).map(memberOf).filter(Boolean).map(m=>m.name).join(', ');log(`congratulated ${who||'the team'} on "${x.title}" 👏`,'help',x)}}
function winsCard(days=14,max=6){const w=recentWins(days);return `<div class="card pad"><h3>Recent wins<span class="c">${w.length||''}</span><span class="sp"></span><button class="btn sm ghost" data-act="go" data-route="reminders">Reminders →</button></h3>${w.length?`<div class="list">${w.slice(0,max).map(winLi).join('')}</div>`:'<div class="empty small">Completed tasks from the last two weeks appear here. Clap 👏 to congratulate colleagues.</div>'}</div>`}

/* ---------------- custom reminders ---------------- */
const REPEATS=[['none','Does not repeat'],['daily','Every day'],['weekdays','Every working day (Mon–Sat)'],['weekly','Every week'],['monthly','Every month']];
const remFor=r=>{const m=me();if(!m)return false;if(isAdmin()&&S.ui.rem.scope==='all')return true;const t=r.teamIds||[];return r.createdBy===m.id||(r.forIds||[]).includes(m.id)||t.includes('all')||t.some(x=>myTeams().includes(x))};
function remOccurs(r,from,to){if(!okDate(r.date))return[];const until=okDate(r.untilDate)&&r.untilDate<to?r.untilDate:to;const out=[];const rep=r.repeat||'none';
 if(rep==='none')return r.date>=from&&r.date<=to?[r.date]:[];
 let d=r.date,guard=0;const step=x=>rep==='daily'||rep==='weekdays'?addDays(x,1):rep==='weekly'?addDays(x,7):(()=>{const p=parseYmd(r.date);const n=parseYmd(x);const k=(n.getFullYear()-p.getFullYear())*12+n.getMonth()-p.getMonth()+1;const y=new Date(p.getFullYear(),p.getMonth()+k,1);const last=new Date(y.getFullYear(),y.getMonth()+1,0).getDate();return ymd(new Date(y.getFullYear(),y.getMonth(),Math.min(p.getDate(),last)))})();
 while(d<=until&&guard++<800){if(d>=from&&(rep!=='weekdays'||!isOffDay(d)))out.push(d);d=step(d)}return out}
const occKey=(r,d)=>'occ:'+r.id+':'+d;
function openRemForm(r,preset={}){const cur={date:today(),time:'10:00',repeat:'none',forIds:[myId()],teamIds:[],...r,...preset};const pf=new Set(cur.forIds||[]);const tf=new Set(cur.teamIds||[]);
 const m=openModal({title:r?'Edit reminder':'New reminder',wide:true,body:`<div class="fld"><label for="rm_t">Remind about</label><input class="inp" id="rm_t" maxlength="150" value="${esc(cur.title||'')}" placeholder="e.g. Send monthly report to HoD / Book hall for convocation"></div>
 <div class="fld"><label for="rm_n">Note (optional)</label><textarea class="inp" id="rm_n" rows="2" maxlength="800">${esc(cur.note||'')}</textarea></div>
 <div class="row3"><div class="fld"><label for="rm_d">Date</label><input class="inp" type="date" id="rm_d" value="${esc(cur.date||'')}"></div><div class="fld"><label for="rm_tm">Time</label><input class="inp" type="time" id="rm_tm" value="${esc(cur.time||'')}"></div><div class="fld"><label for="rm_r">Repeat</label><select class="inp" id="rm_r">${REPEATS.map(([k,l])=>`<option value="${k}" ${cur.repeat===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
 <div class="fld" id="rm_uw"><label for="rm_u">Repeat until (optional)</label><input class="inp" type="date" id="rm_u" value="${esc(cur.untilDate||'')}"></div>
 <div class="fld"><span class="lbl">Remind these people</span><div class="checks" style="max-height:150px;overflow:auto">${[...S.members].sort(byName).map(mm=>`<label><input type="checkbox" name="rmp" value="${esc(mm.id)}" ${pf.has(mm.id)?'checked':''}>${esc(mm.name)}</label>`).join('')}</div></div>
 <div class="fld"><span class="lbl">…and/or whole teams</span>${teamChecks('rmt',tf,true)}</div>
 <div class="small muted">🔒 Only the people and teams you tick (and admins) can see this reminder.</div><div class="err" id="rm_err"></div>`,
 foot:`${r&&r.createdBy===myId()?'<button class="btn dan" data-del>Delete</button>':''}<span class="sp"></span><button class="btn" data-c>Cancel</button><button class="btn pri" data-s>${r?'Save':'Add reminder'}</button>`});
 const el=m.el;const tog=()=>V(el,'#rm_uw').style.display=V(el,'#rm_r').value==='none'?'none':'';tog();V(el,'#rm_r').onchange=tog;V(el,'[data-c]').onclick=m.close;
 const del=V(el,'[data-del]');if(del)del.onclick=async()=>{if(await confirmBox('Delete reminder?',`"<b>${esc(r.title)}</b>"${r.repeat!=='none'?' and all its repeats':''} will be removed for everyone.`,'Delete')){if(await run(()=>BE.del('reminders',r.id),'Reminder deleted','reminders'))m.close()}};
 V(el,'[data-s]').onclick=async()=>{const title=V(el,'#rm_t').value.trim();const date=V(el,'#rm_d').value;const err=s=>V(el,'#rm_err').textContent=s;
  if(!title)return err('Write what to remind about.');if(!okDate(date))return err('Choose a date.');
  const forIds=checked(el,'rmp');const teamIds=checked(el,'rmt');if(!forIds.length&&!teamIds.length)return err('Tick at least one person or team.');
  const body={title,note:V(el,'#rm_n').value.trim(),date,time:V(el,'#rm_tm').value||'',repeat:V(el,'#rm_r').value,untilDate:V(el,'#rm_r').value==='none'?'':V(el,'#rm_u').value||'',forIds,teamIds:teamIds.includes('all')?['all']:teamIds};
  V(el,'[data-s]').disabled=true;let ok;
  if(r)ok=await run(()=>BE.update('reminders',r.id,body),'Reminder saved','reminders');else{Object.assign(body,{id:uid(),visibility:'all',createdBy:myId(),createdAt:Date.now()});ok=await run(()=>BE.add('reminders',body),'Reminder added','reminders')}
  if(ok){if(!r)log(`set a reminder "${title}"${body.repeat!=='none'?' ('+(REPEATS.find(x=>x[0]===body.repeat)||[])[1].toLowerCase()+')':''}`,'info',{visibility:'leads',teamIds:body.teamIds.filter(t=>t!=='all'),assigneeIds:forIds});m.close()}else V(el,'[data-s]').disabled=false}}

/* ---------------- agenda: everything due in a window ---------------- */
function agenda(from,to,mine){const mid=myId();const items=[];const push=(o)=>items.push(o);
 for(const x of S.tasks)if(x.status!=='done'&&okDate(x.due)&&x.due>=from&&x.due<=to&&(!mine||involvedIn(x)))push({d:x.due,kind:'Task',c:STATUS_COL[stKey(x.status)],t:x.title,s:`${teamOf(x.teamId)?.name||''} · ${progOf(x)}% done${(x.assigneeIds||[]).length?' · '+(x.assigneeIds||[]).map(memberOf).filter(Boolean).map(m=>shortName(m.name)).join(', '):''}`,act:'openTask',id:x.id});
 for(const e of S.events)if((e.status||'scheduled')==='scheduled'&&okDate(e.date)&&e.date>=from&&e.date<=to&&e.type!=='Session'&&(!mine||evRelevant(e)))push({d:e.date,tm:e.allDay?'':e.start,kind:e.type||'Event',c:evColor(e),t:e.title,s:`${evTime(e)}${e.location?' · '+e.location:''}`,act:'openEvent',id:e.id});
 for(const b of S.batches)for(const p of(b.playbook||[]))if(p.status!=='done'&&okDate(p.due)&&p.due>=from&&p.due<=to&&(!mine||p.ownerId===mid||b.coordinatorId===mid))push({d:p.due,kind:'Batch',c:'#b45309',t:p.title,s:`${b.name}${memberOf(p.ownerId)?' · '+shortName(memberOf(p.ownerId).name):''}`,act:'openBatch',id:b.id});
 for(const i of S.inits){const inv=i.ownerId===mid||(i.memberIds||[]).includes(mid);
  for(const ms of(i.milestones||[]))if(!ms.done&&okDate(ms.due)&&ms.due>=from&&ms.due<=to&&(!mine||inv||ms.ownerId===mid))push({d:ms.due,kind:'Milestone',c:KIND_COL(i.kind),t:ms.title,s:i.name,act:'openInit',id:i.id});
  if(okDate(i.targetDate)&&i.targetDate>=from&&i.targetDate<=to&&!['Completed','Live'].includes(i.status)&&(!mine||inv))push({d:i.targetDate,kind:'Target',c:KIND_COL(i.kind),t:`${i.name} — target date`,s:`Stage: ${i.stage||i.status}`,act:'openInit',id:i.id})}
 for(const c of (S.checks||[]))if(chkOpen(c)&&okDate(c.due)&&c.due>=from&&c.due<=to&&(!mine||c.ownerId===mid)){const bb=S.batches.find(x=>x.id===c.batchId);push({d:c.due,kind:'Checklist',c:chkTrack(c.track).c,t:c.title,s:`${bb?bb.name+' · ':''}${chkTrack(c.track).name}${memberOf(c.ownerId)&&c.ownerId!==mid?' · '+shortName(memberOf(c.ownerId).name):''}`,act:'openChk',id:c.id})}
 for(const {i:c,d,n} of chkReminders(from,to,mine)){const bb=S.batches.find(x=>x.id===c.batchId);push({d,kind:'Reminder',c:'#e11d48',t:`${c.title} — due in ${n} day${n>1?'s':''}`,s:`${bb?bb.name+' · ':''}${chkTrack(c.track).name} · due ${fmtDay(c.due)}`,act:'openChk',id:c.id})}
 for(const p of S.placements){const inv=p.ownerId===mid||myTeams().includes(p.teamId);if(mine&&!inv)continue;
  if(okDate(p.visitDate)&&p.visitDate>=from&&p.visitDate<=to)push({d:p.visitDate,kind:'Company visit',c:'#0d9488',t:`${p.company} — visit`,s:`${p.stage}${p.contact?' · '+p.contact:''}`,act:'openPlc',id:p.id});
  if(okDate(p.driveDate)&&p.driveDate>=from&&p.driveDate<=to)push({d:p.driveDate,kind:'Placement drive',c:'#0d9488',t:`${p.company} — drive`,s:`${p.roles||p.stage}`,act:'openPlc',id:p.id})}
 const done=store.get('occDone',{});
 for(const r of S.reminders){if(mine&&!((r.forIds||[]).includes(mid)||r.createdBy===mid||(r.teamIds||[]).includes('all')||(r.teamIds||[]).some(t=>myTeams().includes(t))))continue;
  for(const d of remOccurs(r,from,to))push({d,tm:r.time,kind:'Reminder',c:'#e11d48',t:r.title,s:`${okTime(r.time)?fmtTime(r.time)+' · ':''}${r.repeat&&r.repeat!=='none'?'Repeats: '+(REPEATS.find(x=>x[0]===r.repeat)||[])[1]:'One-time'}${r.note?' · '+r.note:''}`,act:'editRem',id:r.id,rep:r.repeat&&r.repeat!=='none',occ:occKey(r,d),isDone:!!done[occKey(r,d)]})}
 return items.sort((a,b)=>(a.d+(a.tm||'99')).localeCompare(b.d+(b.tm||'99')))}
function agendaLi(a){const d=parseYmd(a.d);return `<div class="li ${a.isDone?'done-occ':''}"><div class="datebox" style="background:color-mix(in srgb,${a.c} 11%,var(--mix));color:${a.c}"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-IN',{weekday:'short'})}</span></div><div class="grow click" data-act="${a.act}" data-id="${esc(a.id)}" role="button" tabindex="0"><div class="t">${esc(a.t)}</div><div class="small muted"><span class="kindtag" style="--c:${a.c}">${esc(a.kind)}</span> ${esc(a.s)}</div></div>${a.occ?`<button class="btn sm ${a.isDone?'soft':'ghost'}" data-act="occDone" data-k="${esc(a.occ)}" aria-pressed="${a.isDone}" title="${a.isDone?'Mark not done':'Mark done for this date'}">${a.isDone?'✓ Done':'Done'}</button>`:''}</div>`}

/* ---------------- REMINDERS view ---------------- */
function viewReminders(){const t=today();const mine=S.ui.rem.scope!=='all';const d=parseYmd(t);const end=ymd(new Date(d.getFullYear(),d.getMonth()+3,0));
 const wk7=addDays(t,7);const items=agenda(t,end,mine).filter(a=>!a.rep||a.d<=wk7);const od=S.tasks.filter(x=>isOverdue(x)&&(!mine||involvedIn(x))).sort((a,b)=>a.due.localeCompare(b.due));
 const todayI=items.filter(a=>a.d===t);const weekI=items.filter(a=>a.d>t&&a.d<=addDays(t,7));
 let h=`<div class="toolbar"><div class="toggle"><button class="${mine?'on':''}" data-act="remScope" data-v="mine">Mine & my teams</button><button class="${mine?'':'on'}" data-act="remScope" data-v="all">Everything I can see</button></div><span style="flex:1"></span><button class="btn" data-act="todaySummary">Today's summary</button><button class="btn pri" data-act="newReminder">+ Reminder</button></div>
 <div class="small muted" style="margin:-6px 0 14px">Everything due <b>this month and the next 2 months</b> — tasks, events, batch milestones, initiative targets, company visits and drives. Repeating reminders show for the coming week; all of them are listed under <b>Regular reminders</b>.</div>
 <div class="grid kpis" style="margin-bottom:16px">${kpi('Today',todayI.length,'bell','#e11d48',todayI.length?'warn':'')}${kpi('Next 7 days',weekI.length,'clock','#d97706')}${kpi('Overdue tasks',od.length,'alert','#dc2626',od.length?'warn':'')}${kpi('Till '+parseYmd(end).toLocaleDateString('en-IN',{month:'short'}),items.length,'calendar','#6366f1')}${kpi('Wins (14 days)',recentWins(14).length,'participation','#16a34a')}</div>
 <div class="grid two"><div style="display:flex;flex-direction:column;gap:16px">`;
 if(od.length)h+=`<div class="card pad" style="border-color:#fecaca"><h3><span class="od">Overdue</span><span class="c">${od.length}</span></h3><div class="list">${od.slice(0,10).map(x=>agendaLi({d:x.due,kind:'Overdue task',c:'#dc2626',t:x.title,s:`${teamOf(x.teamId)?.name||''} · ${daysBetween(x.due,t)} day${daysBetween(x.due,t)!==1?'s':''} late · ${progOf(x)}%`,act:'openTask',id:x.id})).join('')}</div>${od.length>10?`<div class="small muted" style="padding:8px">+${od.length-10} more in Tasks</div>`:''}</div>`;
 for(let k=0;k<3;k++){const ms=ymd(new Date(d.getFullYear(),d.getMonth()+k,1)).slice(0,7);const its=items.filter(a=>a.d.startsWith(ms));
  h+=`<div class="card pad"><h3>${k===0?'This month · ':''}${fmtMonth(ms)}<span class="c">${its.length||''}</span></h3>${its.length?`<div class="list">${its.map(agendaLi).join('')}</div>`:'<div class="empty small">Nothing due.</div>'}</div>`}

const WD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseDue(words){const t=today();let due='',used=[];
 for(let i=0;i<words.length;i++){const w=words[i].toLowerCase().replace(/[,.]$/,'');
  if(w==='today'){due=t;used.push(i)}else if(w==='tomorrow'||w==='tmrw'){due=addDays(t,1);used.push(i)}
  else if(WD.includes(w)||WD.some(d=>d.slice(0,3)===w)){const k=WD.findIndex(d=>d===w||d.slice(0,3)===w);let n=(k-new Date().getDay()+7)%7;if(n===0)n=7;due=addDays(t,n);used.push(i);if(['by','on','due'].includes((words[i-1]||'').toLowerCase()))used.push(i-1)}
  else if(w==='next'&&(words[i+1]||'').toLowerCase()==='week'){due=addDays(t,7-((new Date().getDay()+6)%7));used.push(i,i+1)}
  else if(w==='in'&&/^\d+$/.test(words[i+1]||'')&&/^days?$/i.test(words[i+2]||'')){due=addDays(t,+words[i+1]);used.push(i,i+1,i+2)}
  else if(/^\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?$/.test(w)){const[d,m,y]=w.split(/[\/\-.]/).map(Number);const yy=y?(y<100?2000+y:y):new Date().getFullYear();const dt=new Date(yy,m-1,d);if(!isNaN(dt)){due=ymd(dt);if(!y&&due<t)due=ymd(new Date(yy+1,m-1,d));used.push(i)}}}
 return{due,used}}
function parseTaskCmd(q){let words=q.trim().split(/\s+/);if(!words.length)return null;const verb=words[0].toLowerCase();
 if(!['assign','task','todo','add','new'].includes(verb)&&!q.includes('@'))return null;
 if(['assign','task','todo','add','new'].includes(verb))words=words.slice(1);
 let who='',team='';const drop=new Set();
 words.forEach((w,i)=>{const lw=w.toLowerCase().replace(/^@/,'').replace(/[,.]$/,'');
  if(!who){const m=S.members.find(mm=>{const f=shortName(mm.name).toLowerCase();return f===lw||mm.id===lw});if(m&&(w.startsWith('@')||i===0||['to','for'].includes((words[i-1]||'').toLowerCase())||i<3)){who=m.id;drop.add(i);if(['to','for'].includes((words[i-1]||'').toLowerCase()))drop.add(i-1);return}}
  if(!team&&w.startsWith('#')){const tm=S.teams.find(t=>t.name.toLowerCase().replace(/[^a-z0-9]/g,'')===lw.replace(/^#/,'').replace(/[^a-z0-9]/g,''));if(tm){team=tm.id;drop.add(i)}}});

 let title=words.filter((_,i)=>!drop.has(i)).join(' ').trim();if(!title)return null;title=title[0].toUpperCase()+title.slice(1);
 if(!team){const mt=who?(memberOf(who)?.teamIds||[]).find(leadsTeam):null;team=mt||S.teams.find(t=>leadsTeam(t.id))?.id||''}
 return{title,who,team,due:pd.due}}

function infPath(kind){const N=32,cx=300,cy=150,R=105,A=250;
 const f=t=>{if(kind==='circle')return[cx+R*Math.cos(t),cy+R*Math.sin(t)];const d=1+Math.sin(t)**2;return[cx+A*Math.cos(t)/d,cy+A*Math.sin(t)*Math.cos(t)/d*1.15]};
 const P=[...Array(N)].map((_,i)=>f(2*Math.PI*i/N));const q=n=>n.toFixed(1);let s=`M${q(P[0][0])} ${q(P[0][1])}`;
 for(let i=0;i<N;i++){const p0=P[(i-1+N)%N],p1=P[i],p2=P[(i+1)%N],p3=P[(i+2)%N];
  s+=`C${q(p1[0]+(p2[0]-p0[0])/6)} ${q(p1[1]+(p2[1]-p0[1])/6)} ${q(p2[0]-(p3[0]-p1[0])/6)} ${q(p2[1]-(p3[1]-p1[1])/6)} ${q(p2[0])} ${q(p2[1])}`}
 return s+'Z'}

/* ---------- dates: anchors, working days, phases, module lab exams ---------- */
const addWorkDays=(d,n)=>{let x=d;let k=0;for(let g=0;k<n&&g<400;g++){x=addDays(x,1);if(!isOffDay(x))k++}return x};
const toWorkDay=d=>{let x=d;for(let g=0;isOffDay(x)&&g<7;g++)x=addDays(x,-1);return x};
function batchEvents(b){const lo=addDays(b.start,-45),hi=addDays(okDate(b.end)?b.end:addDays(b.start,180),120);
 return S.events.filter(e=>okDate(e.date)&&(e.batchId===b.id||(!e.batchId&&(e.teamIds||[]).includes(b.teamId)&&e.date>=lo&&e.date<=hi))).sort((a,x)=>a.date.localeCompare(x.date))}
function chkAnchors(b){const evs=batchEvents(b);const out={};for(const [k,a] of Object.entries(CHK_ANCHORS)){const e=evs.find(x=>a.re.test(x.title||''));out[k]=e?{date:e.date,found:true,title:e.title}:{date:pbDueDate(a.fb,b.start,b.end),found:false}}return out}
function chkDue(rel,b,anc){if(['s','e','mid'].includes(rel[0]))return pbDueDate(rel,b.start,b.end);const a=anc[rel[0]];return a?addDays(a.date,rel[1]):''}
function chkPhaseOf(d,b,anc){const end=okDate(b.end)?b.end:addDays(b.start,180);if(d<b.start)return 'Before start';if(d<addDays(b.start,30))return 'First month';if(d>end)return 'After the course';
 if(d>=addDays(anc.ccpp.date,-75))return 'Placement season';if(d>=addDays(anc.cmce.date,-25))return 'Mid-course';return 'Building up'}
const NOT_MODULE=/revision|cmce|ccee|picnic|outing|mock|convocation|farewell|placement|inaugur|induction|sports|team build|ccpp|project|holiday|aptitude|communication|exam/i;
function batchModules(b){const evs=batchEvents(b).filter(e=>e.type==='Session');const mods=[];
 evs.forEach((e,n)=>{if(NOT_MODULE.test(e.title||''))return;const next=evs.slice(n+1).find(x=>x.date>e.date);const endD=okDate(e.endDate)&&e.endDate>e.date?e.endDate:next?toWorkDay(addDays(next.date,-1)):toWorkDay(addDays(e.date,14));
  if(!mods.some(m=>m.title.toLowerCase()===(e.title||'').trim().toLowerCase()))mods.push({title:(e.title||'').trim(),start:e.date,end:endD})});return mods}
/* lab exam at the end of each module, results 10 working days later, a mid-module quiz halfway — each with a reminder 3 days before */
function moduleRows(b,anc,owner,existing){const rows=[];const now=Date.now();const have=new Set(existing.map(i=>(i.meta||{}).kind+'|'+((i.meta||{}).module||'').toLowerCase()));let n=500;
 for(const m of batchModules(b)){const key=m.title.toLowerCase();const len=daysBetween(m.start,m.end);
  const base={batchId:b.id,track:'course',teamId:b.teamId,ownerId:owner,status:'todo',doneAt:null,evidence:'',updates:[],reviews:[],visibility:'all',createdBy:myId(),createdAt:now,updatedAt:now};
  if(len>=6&&!have.has('quiz|'+key)){const d=toWorkDay(addDays(m.start,Math.round(len/2)));rows.push({...base,id:uid(),title:`Mid-module quiz — ${m.title}`,description:'Quiz held on Netra; scores shared with students',phase:chkPhaseOf(d,b,anc),due:d,order:n++,remind:[3],meta:{kind:'quiz',module:m.title,cal:1}})}
  if(!have.has('labexam|'+key)){const lid=uid();const rid=uid();const res=addWorkDays(m.end,10);
   rows.push({...base,id:lid,title:`Lab exam — ${m.title}`,description:'Lab exam held for every student at the end of the module',phase:chkPhaseOf(m.end,b,anc),due:m.end,order:n++,remind:[3],meta:{kind:'labexam',module:m.title,link:rid,cal:1}});
   rows.push({...base,id:rid,title:`Lab exam results — ${m.title}`,description:'Marks evaluated and shared within 10 working days of the lab exam',phase:chkPhaseOf(res,b,anc),due:res,order:n++,remind:[3],meta:{kind:'result',module:m.title,cal:1}})}}
 return rows}
/* when a lab exam is ticked, its results date = 10 working days after the exam */
async function chkAfterDone(i){if((i.meta||{}).kind!=='labexam'||!i.meta.link)return;const r=(S.checks||[]).find(x=>x.id===i.meta.link);if(!r||r.status==='done')return;
 const t=today();const held=okDate(i.due)&&i.due<t?i.due:t;const nd=addWorkDays(held,10); /* counted from the exam day, or today if it was held early */if(nd!==r.due){try{await BE.update('checks',r.id,{due:nd,updatedAt:Date.now()});onLive('checks')}catch{}}}
function chkMonthly(t,b,anc,owner,k,startOrder){const [,title,desc,,o]=t;const until=o.monthly.until==='e'?(okDate(b.end)?b.end:addDays(b.start,180)):anc[o.monthly.until]?.date||b.end;const rows=[];const now=Date.now();
 for(let m=0;m<12;m++){const d=toWorkDay(addDays(b.start,m*30+(o.monthly.day||25)));if(d>until)break;
  rows.push({id:uid(),batchId:b.id,track:k,teamId:chkTeamFor(k,b),title:`${title} — month ${m+1}`,description:desc,phase:chkPhaseOf(d,b,anc),due:d,ownerId:owner,status:'todo',doneAt:null,evidence:'',updates:[],reviews:[],order:startOrder+m,visibility:'all',createdBy:myId(),createdAt:now,updatedAt:now,remind:o.rem||[7,3],meta:{kind:'monthly',cal:o.cal?1:0}})}
 return rows}
function chkRows(b,k,owner){const anc=chkAnchors(b);const now=Date.now();const rows=[];
 CHK_TEMPLATE[k].forEach((t,n)=>{const [phase,title,desc,rel,o={}]=t;if(o.monthly){rows.push(...chkMonthly(t,b,anc,owner,k,200+n*20));return}
  const due=chkDue(rel,b,anc);rows.push({id:uid(),batchId:b.id,track:k,teamId:chkTeamFor(k,b),title,description:desc,phase:phase||chkPhaseOf(due,b,anc),due,ownerId:owner,status:'todo',doneAt:null,evidence:'',updates:[],reviews:[],order:n,visibility:'all',createdBy:myId(),createdAt:now,updatedAt:now,remind:o.rem||[3],meta:o.cal?{cal:1}:{}})});
 if(k==='course')rows.push(...moduleRows(b,anc,owner,[]));
 return rows}

const chkOf=bid=>(S.checks||[]).filter(i=>i.batchId===bid);
const chkOpen=i=>i.status!=='done'&&i.status!=='na';
const chkLate=i=>chkOpen(i)&&okDate(i.due)&&i.due<today();
const chkPct=items=>{const n=items.filter(i=>i.status!=='na');return n.length?Math.round(n.filter(i=>i.status==='done').length/n.length*100):null};
const batchMgr=b=>!!b&&(b.coordinatorId===myId()||headsTeam(b.teamId));
const canSetupChk=b=>isLeadAny()||isHod()||batchMgr(b);
const chkMgr=i=>isHod()||headsTeam(i.teamId)||i.createdBy===myId()||batchMgr(S.batches.find(b=>b.id===i.batchId));

const chkCheckerIds=(track,teamId)=>((S.chkcheckers||[]).find(c=>c.id===track+'|'+teamId)||{}).memberIds||[];
const isChkChecker=i=>chkCheckerIds(i.track,i.teamId).includes(myId());
const canSetChecker=teamId=>isAdmin()||isHod()||headsTeam(teamId);
const chkProg=i=>headsTeam(i.teamId)||i.ownerId===myId()||isChkChecker(i); // HoD assigns & reviews, but doesn't tick other people's work
const chkRev=i=>isHod()||headsTeam(i.teamId);

function batchChecklistCard(b){const items=chkOf(b.id);const tab=S.ui.chkTab||'overview';const can=canSetupChk(b);
 const missing=CHK_TRACKS.filter(t=>!items.some(i=>i.track===t.k));
 let h=`<div class="card pad chkcard" style="margin-bottom:16px"><h3>Team checklists<span class="c">${items.length?`${chkPct(items)??0}% done`:''}</span><span class="sp"></span>${can&&missing.length?`<button class="btn sm ${items.length?'':'pri'}" data-act="chkSetup" data-id="${esc(b.id)}">${items.length?'+ Add a team checklist':'Set up checklists'}</button>`:''}${items.length&&can&&chkNewCount(b)?`<button class="btn sm" data-act="chkSync" data-id="${esc(b.id)}" title="Standard activities added to Ekatra after this batch's lists were set up">＋ ${chkNewCount(b)} new standard items</button>`:''}${items.length&&canSetupChk(b)?`<button class="btn sm" data-act="chkAdd" data-id="${esc(b.id)}" data-t="${esc(tab==='overview'?'':tab)}">+ Item</button>`:''}</h3>`;
 if(!items.length)return h+`<div class="empty"><b>No checklists for this batch yet</b>One list per team — Placement, Course team, Student activities, E&amp;T Admin, Marketing and HoD reviews — with about 160 dated activities for a 6-month batch — lab exams, quizzes and results per module, monthly sessions, picnic, convocation and placement preparation. Owners see their items in “My work”; HoD reviews and gives feedback.${can?'':' A team head, the batch coordinator or HoD can set them up.'}</div></div>`;
 const tracks=CHK_TRACKS.filter(t=>items.some(i=>i.track===t.k));
 h+=`<div class="toggle chktabs" role="tablist" style="margin-bottom:14px;flex-wrap:wrap"><button class="${tab==='overview'?'on':''}" data-act="chkTab" data-v="overview">Overview</button>${tracks.map(t=>{const its=items.filter(i=>i.track===t.k);const l=its.filter(chkLate).length;return `<button class="${tab===t.k?'on':''}" data-act="chkTab" data-v="${t.k}">${t.icon} ${esc(t.name)} · ${chkPct(its)??0}%${l?` <span class="od">· ${l} late</span>`:''}</button>`}).join('')}</div>`;
 if(tab==='overview'||!tracks.some(t=>t.k===tab)){
  h+=`<div class="chkov">${tracks.map(t=>{const its=items.filter(i=>i.track===t.k);const p=chkPct(its)??0;const l=its.filter(chkLate).length;const nx=its.filter(chkOpen).sort((a,x)=>(a.due||'9999').localeCompare(x.due||'9999'))[0];const owners=[...new Set(its.map(i=>i.ownerId).filter(Boolean))];const rv=avgRating(its);
   return `<div class="chkrow click" data-act="chkTab" data-v="${t.k}" role="button" tabindex="0"><div class="chkname"><span aria-hidden="true">${t.icon}</span><div><b>${esc(t.name)}</b><div class="xs muted">${its.filter(i=>i.status==='done').length}/${its.filter(i=>i.status!=='na').length} done${l?` · <span class="od">${l} late</span>`:''}${rv?` · ${stars(Math.round(rv))}`:''}</div></div></div>
    <div class="bar" style="--c:${t.c};flex:1"><i style="width:${p}%"></i></div><b style="width:42px;text-align:right">${p}%</b><div class="chknext small muted">${nx?`Next: ${esc(nx.title)} · <span class="${chkLate(nx)?'od':''}">${fmtDay(nx.due)}</span>`:'All done 🎉'}</div><div>${avatars(owners,3,'sm')}</div></div>`}).join('')}</div>`}
 else{const t=chkTrack(tab);const its=items.filter(i=>i.track===tab);

  for(const ph of CHK_PHASES){const list=its.filter(i=>(i.phase||'')===ph).sort(chkSort);if(!list.length)continue;h+=`<div class="phase"><h4>${ph}<span class="pill">${list.filter(i=>i.status==='done').length}/${list.filter(i=>i.status!=='na').length}</span></h4>${list.map(i=>chkLi(i)).join('')}</div>`}

   How a team works in Ekatra:
   plan (head / HoD) → do (owner posts updates + the next step) → stuck? "Blocked" asks the head for help →
   done → the person who assigned it reviews (approve with ★ feedback, or send back) → Friday team check-in. */

/* ---------- next step & blocked (tasks and checklist items) ---------- */

const nextLine=x=>nextStepOf(x)?`<div class="fl-next">→ ${esc(nextStepOf(x))}</div>`:'';
/* review is needed when someone else assigned the task and the person finishing it isn't that team's head or HoD */
const reviewNeeded=x=>!!x.createdBy&&x.createdBy!==myId()&&!headsTeam(x.teamId)&&!isHod()&&doesTask(x);

/* ---------- @mentions ---------- */
const unameOf=m=>(m&&(m.username||shortName(m.name).toLowerCase().replace(/[^a-z0-9]/g,'')))||'';
function fmtMention(t){return esc(t||'').replace(/@([a-z0-9_.-]{2,30})/gi,(all,u)=>{const m=S.members.find(x=>unameOf(x).toLowerCase()===u.toLowerCase());return m?`<span class="mention" title="${esc(m.name)}">@${esc(unameOf(m))}</span>`:all})}
function mentionsForMe(days=21){const m=me();if(!m)return[];const u=unameOf(m).toLowerCase();if(!u)return[];const re=new RegExp('@'+u.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z0-9_])','i');const from=Date.now()-days*864e5;const out=[];
 const scan=(col,x)=>{for(const up of (x.updates||[]))if(+up.at>=from&&up.by!==m.id&&re.test(up.text||''))out.push({col,x,u:up,key:col+'|'+x.id+'|'+up.at});for(const r of (x.reviews||[]))if(+r.at>=from&&r.by!==m.id&&re.test(r.text||''))out.push({col,x,u:r,key:col+'|'+x.id+'|r'+r.at})};
 S.tasks.forEach(x=>scan('tasks',x));(S.checks||[]).forEach(x=>scan('checks',x));return out.sort((a,b)=>(+b.u.at)-(+a.u.at))}
/* type @ in a comment box to pick a colleague */
function attachMention(inp){if(!inp||inp.dataset.mention)return;inp.dataset.mention='1';
 inp.addEventListener('input',()=>{const pos=inp.selectionStart||0;const before=inp.value.slice(0,pos);const mt=before.match(/(^|\s)@([a-z0-9_.-]*)$/i);if(!mt){if(openMenu&&openMenu.classList.contains('mn'))closeMenu();return}
  const q=mt[2].toLowerCase();const list=S.members.filter(m=>m.id!==myId()&&(unameOf(m).toLowerCase().startsWith(q)||m.name.toLowerCase().includes(q))).sort(byName).slice(0,6);if(!list.length){closeMenu();return}
  popMenu(inp,list.map(m=>`<button data-u="${esc(unameOf(m))}">${avatar(m,'sm')}<span><b style="font-weight:600">${esc(m.name)}</b><small>@${esc(unameOf(m))}</small></span></button>`).join(''),menu=>{menu.classList.add('mn');menu.querySelectorAll('[data-u]').forEach(b=>b.onmousedown=e=>{e.preventDefault();const u=b.dataset.u;const start=pos-mt[2].length-1;inp.value=inp.value.slice(0,start)+'@'+u+' '+inp.value.slice(pos);const np=start+u.length+2;inp.focus();inp.setSelectionRange(np,np);closeMenu()})})})}

/* ---------- WEEKLY TEAM CHECK-IN ---------- */
function ckWeek(off=0){return addDays(weekStart(today()),off*7)}
function memberWeek(mid,tid,ws){const we=addDays(ws,6);const inW=ms=>{if(!ms)return false;const d=ymd(new Date(+ms));return d>=ws&&d<=we};const t=today();
 const tk=S.tasks.filter(x=>x.teamId===tid&&((x.assigneeIds||[]).includes(mid)||x.ownerId===mid));const ck=(S.checks||[]).filter(i=>i.ownerId===mid&&i.teamId===tid);
 const done=[...tk.filter(x=>x.status==='done'&&inW(x.doneAt)),...ck.filter(i=>i.status==='done'&&inW(i.doneAt))];
 const slipping=[...tk.filter(isOverdue),...ck.filter(chkLate)];
 const nf=addDays(we>t?t:we,1),nt=addDays(nf,6);
 const next=[...tk.filter(x=>x.status!=='done'&&okDate(x.due)&&x.due>=nf&&x.due<=nt),...ck.filter(i=>chkOpen(i)&&okDate(i.due)&&i.due>=nf&&i.due<=nt)];
 const blocked=[...tk.filter(isBlocked),...ck.filter(isBlocked)];const steps=[...tk,...ck].filter(nextStepOf).slice(0,2);
 return{done,slipping,next,blocked,steps}}
function viewCheckin(){const f=S.ui.ck||(S.ui.ck={off:0,team:''});const ws=ckWeek(f.off);const we=addDays(ws,6);
 const vis=S.teams.filter(t=>isHod()||isAdmin()||headsTeam(t.id)||myTeams().includes(t.id));const teams=f.team?vis.filter(t=>t.id===f.team):vis;
 let h=`<div class="toolbar"><div class="toggle"><button class="${f.off===0?'on':''}" data-act="ckWeek" data-v="0">This week</button><button class="${f.off===-1?'on':''}" data-act="ckWeek" data-v="-1">Last week</button><button class="${f.off===-2?'on':''}" data-act="ckWeek" data-v="-2">2 weeks ago</button></div>
 <select class="inp" data-change="ckteam" aria-label="Team" style="max-width:200px"><option value="">${isHod()||isAdmin()?'All teams':'My teams'}</option>${vis.map(t=>`<option value="${esc(t.id)}" ${f.team===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
 <span style="flex:1"></span><span class="small muted">${fmtDay(ws)} – ${fmtDay(we)}</span></div>
 <div class="small muted" style="margin:-4px 0 14px">Filled in automatically from tasks and checklists: what each person finished this week, what is slipping, what is coming next week and who is blocked. The team head adds one note — wins, risks and help needed — every Friday.</div>`;
 if(!teams.length)return h+`<div class="card pad empty"><b>No teams to show</b>You see the check-in of the teams you belong to.</div>`;
 for(const t of teams){const ms=teamMembers(t.id);const rows=ms.map(m=>({m,w:memberWeek(m.id,t.id,ws)}));const tot=k=>rows.reduce((a,r)=>a+r.w[k].length,0);
  const note=(S.checkins||[]).find(c=>c.teamId===t.id&&c.week===ws);const canNote=headsTeam(t.id)||isHod();const lead=memberOf(t.leadId);
  h+=`<div class="card pad ckcard" style="--c:${col(t.color)};margin-bottom:16px"><h3><span class="dot" style="background:${col(t.color)}"></span>${esc(t.name)}<span class="c">${lead?'Head: '+esc(lead.name):''}</span><span class="sp"></span><span class="ck-k ok">✓ ${tot('done')} done</span><span class="ck-k ${tot('slipping')?'bad':''}">⚠ ${tot('slipping')} slipping</span><span class="ck-k">→ ${tot('next')} next week</span>${tot('blocked')?`<span class="ck-k bad">🚧 ${tot('blocked')} blocked</span>`:''}</h3>
  <div class="ck-grid"><div class="ck-h">Person</div><div class="ck-h">Done this week</div><div class="ck-h">Slipping</div><div class="ck-h">Coming next</div><div class="ck-h">Next step / blocked</div>
  ${rows.map(({m,w})=>`<div class="ck-p" data-act="openPerson" data-id="${esc(m.id)}" role="button" tabindex="0">${avatar(m,'sm')}<span>${esc(shortName(m.name))}${t.leadId===m.id?' <span class="xs muted">· head</span>':''}</span></div>
   <div>${ckList(w.done,'ok')}</div><div>${ckList(w.slipping,'bad')}</div><div>${ckList(w.next,'')}</div>
   <div>${w.blocked.map(x=>`<div class="ck-i bad" data-act="${x.track?'openChk':'openTask'}" data-id="${esc(x.id)}">🚧 ${esc(x.title)} — <i>${esc(x.blocked)}</i></div>`).join('')}${w.steps.map(x=>`<div class="ck-i" data-act="${x.track?'openChk':'openTask'}" data-id="${esc(x.id)}">→ ${esc(nextStepOf(x))}</div>`).join('')}${!w.blocked.length&&!w.steps.length?'<span class="muted xs">—</span>':''}</div>`).join('')}</div>
  <div class="ck-note"><div class="xs muted" style="margin-bottom:6px">HEAD’S NOTE FOR THE WEEK</div>${canNote&&f.off>=-1?`<textarea class="inp" rows="3" maxlength="1500" data-cknote="${esc(t.id)}" placeholder="Wins this week · risks · where the team needs help · what’s next">${esc(note?.note||'')}</textarea><div style="display:flex;gap:8px;align-items:center;margin-top:8px">${note?`<span class="xs muted">Saved by ${esc(note.byName||'')} · ${ago(+note.updatedAt||0)}</span>`:''}<span class="sp" style="flex:1"></span><button class="btn sm pri" data-act="ckSave" data-id="${esc(t.id)}">Save note</button></div>`
   :note?`<div style="white-space:pre-wrap">${fmtMention(note.note)}</div><div class="xs muted" style="margin-top:6px">${esc(note.byName||'')} · ${ago(+note.updatedAt||0)}</div>`:'<div class="muted small">No note yet.</div>'}</div></div>`}
 return h}

/* =====================================================================
   EKATRA PLUS (23 Nov 2026)
   1. Programmes: initiatives that share a prefix ("M2030 · …") are clubbed
      into one programme — e.g. all Mission 2030 work together, with overall
      progress, status mix, teams and owners.
   2. Hover previews: rest the mouse on any task, initiative, checklist item,
      batch, event or person to see its key details without opening it.
   ===================================================================== */
const PROG_NAMES={M2030:'Mission 2030'};
const PROG_SEP=' · ';
function progKeyOf(i){const n=String(i?.name||'');const k=n.indexOf(PROG_SEP);if(k<1||k>24)return '';return n.slice(0,k).trim()}
function programmes(list){const m=new Map();for(const i of list){const k=progKeyOf(i);if(!k)continue;if(!m.has(k))m.set(k,[]);m.get(k).push(i)}
 for(const[k,v]of[...m])if(v.length<2&&!PROG_NAMES[k])m.delete(k);return m}
const progName=k=>PROG_NAMES[k]||k;
const shortInitName=i=>{const k=progKeyOf(i);return k?String(i.name).slice(k.length+PROG_SEP.length):i.name};
function progStats(its){const t=today();const ps=its.map(initProg).filter(p=>p!=null);
 return{n:its.length,avg:ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):0,
  late:its.filter(i=>okDate(i.targetDate)&&i.targetDate<t&&!['Completed','Live','On hold'].includes(i.status)).length,
  teams:[...new Set(its.map(i=>i.teamId).filter(Boolean))],owners:[...new Set(its.map(i=>i.ownerId).filter(Boolean))],
  noOwner:its.filter(i=>!memberOf(i.ownerId)).length,
  status:INIT_STATUS.map(s=>[s,its.filter(i=>i.status===s).length]).filter(([,n])=>n),
  next:its.flatMap(i=>(i.milestones||[]).filter(m=>!m.done&&okDate(m.due)).map(m=>({m,i}))).sort((a,b)=>a.m.due.localeCompare(b.m.due))[0]}}
function statusStrip(st,h=8){const tot=st.reduce((a,[,n])=>a+n,0)||1;return `<div class="statusbar" style="height:${h}px">${st.map(([s,n])=>`<i style="width:${n/tot*100}%;background:${INIT_STATUS_COL[s]||'#64748b'}" title="${esc(s)}: ${n}"></i>`).join('')}</div>`}

/* programme panel on the Initiatives page */
function progPanel(k,its,fixed){const s=progStats(its);const open=fixed||(S.ui.progOpen||(S.ui.progOpen={}))[k]!==false;const tf=(S.ui.progTeam||(S.ui.progTeam={}))[k]||'';
 const shown=tf?its.filter(i=>i.teamId===tf):its;
 const byTeam=s.teams.map(t=>[t,its.filter(i=>i.teamId===t).length]).sort((a,b)=>b[1]-a[1]);
 return `<section class="prog ${open?'open':''}" style="--c:var(--p)">
 <div class="prog-h" ${fixed?'':`data-act="progToggle" data-k="${esc(k)}" role="button" tabindex="0" aria-expanded="${open}"`}>
  ${ring(s.avg,'var(--p)')}
  <div class="prog-t"><div class="prog-k">${esc(k)}</div><h2>${esc(progName(k))}</h2>
   <div class="small muted">${s.n} initiatives · ${s.teams.length} teams · ${s.owners.length} owners${s.late?` · <span class="od">${s.late} past target</span>`:''}${s.noOwner?` · <span class="od">${s.noOwner} without owner</span>`:''}</div>
   <div style="margin-top:8px;max-width:520px">${statusStrip(s.status)}<div class="legend">${s.status.map(([st,n])=>`<span style="--c:${INIT_STATUS_COL[st]}">${esc(st)} ${n}</span>`).join('')}</div></div></div>
  <div class="prog-r">${avatars(s.owners,6)}${s.next?`<div class="xs muted" style="margin-top:8px;text-align:right">Next milestone: <b>${esc(s.next.m.title)}</b><br>${fmtDay(s.next.m.due)} · ${esc(shortInitName(s.next.i))}</div>`:''}${fixed?'':'<span class="prog-chev" aria-hidden="true">›</span>'}</div>
 </div>
 ${open?`<div class="prog-b"><div class="prog-f"><button class="chip ${!tf?'on':''}" data-act="progTeam" data-k="${esc(k)}" data-v="">All ${s.n}</button>${byTeam.map(([t,n])=>`<button class="chip ${tf===t?'on':''}" data-act="progTeam" data-k="${esc(k)}" data-v="${esc(t)}"><span class="dot" style="background:${col(teamOf(t)?.color)}"></span>${esc(teamOf(t)?.name||t)} ${n}</button>`).join('')}</div>
  <div class="grid cards-grid">${shown.map(i=>initCard({...i,name:shortInitName(i)})).join('')}</div></div>`:''}
 </section>`}
function initGrouped(list){const pm=programmes(list);const inProg=new Set([...pm.values()].flat().map(i=>i.id));const rest=list.filter(i=>!inProg.has(i.id));
 let h=[...pm.entries()].sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>progPanel(k,v)).join('');
 if(rest.length)h+=`${pm.size?`<div class="sec-title">Other initiatives<span class="c">${rest.length}</span></div>`:''}<div class="grid cards-grid">${rest.map(initCard).join('')}</div>`;
 return h}

/* "Initiatives I own" chips: one chip per programme */
function initChips(inits){const pm=programmes(inits);const inProg=new Set([...pm.values()].flat().map(i=>i.id));
 return [...pm.entries()].map(([k,v])=>{const s=progStats(v);return `<button class="cat click" style="--c:var(--p)" data-act="go" data-route="initiatives" data-hover="prog:${esc(k)}:mine">${esc(progName(k))} · ${v.length} · ${s.avg}%</button>`}).join('')
  +inits.filter(i=>!inProg.has(i.id)).map(i=>`<button class="cat click" style="--c:${KIND_COL(i.kind)}" data-act="openInit" data-id="${esc(i.id)}">${esc(i.name)} · ${initProg(i)!=null?initProg(i)+'%':esc(i.status)}</button>`).join('')}
